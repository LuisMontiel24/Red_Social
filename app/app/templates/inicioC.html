{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <h1>Formulario</h1>

    {% if mensaje_error %}
    <p style="color: red;">{{ mensaje_error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Iniciar Sesión</button>
    </form>
{% endblock %}
