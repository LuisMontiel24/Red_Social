version: '3.1'

services:
  db:
    image: postgres:13
    container_name: instatic_postgres
    environment:
      POSTGRES_DB: instatic_db
      POSTGRES_USER: instatic_user
      POSTGRES_PASSWORD: instatic_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: